
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منهاج التعلّم | الجمع حتى ١٨</title>

<style>
/* ===== أساسيات تربوية ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #fff7ec;
  font-family: "Arial", sans-serif;
  color: #333;
}

/* ===== الحاوية العامة ===== */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== الشريط العلوي ===== */
header {
  background: #fff;
  border-bottom: 1px solid #eee;
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 18px;
  margin: 0;
}

.fs-btn {
  font-size: 14px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #aaa;
  cursor: pointer;
}

/* ===== منطقة التعلّم (التركيز) ===== */
.main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

.board {
  background: #ffffff;
  border-radius: 16px;
  padding: 16px;
  max-width: 720px;
  width: 100%;
  text-align: center;
}

/* ===== العناصر البصرية ===== */
.rabbit {
  font-size: 56px;
  margin-bottom: 6px;
}

.question {
  font-size: 18px;
  margin-bottom: 10px;
}

.visual {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 34px;
  margin: 12px 0;
  flex-wrap: wrap;
}

/* ===== أزرار الإجابة ===== */
.choices {
  margin-top: 10px;
}

.choices button {
  font-size: 18px;
  width: 70px;
  height: 54px;
  margin: 6px;
  border-radius: 10px;
  border: 1px solid #999;
  background: #f5f5f5;
  cursor: pointer;
}

/* ===== التغذية الراجعة ===== */
.feedback {
  min-height: 28px;
  font-size: 18px;
  margin-top: 8px;
}

/* ===== شريط المعلم ===== */
.teacher-bar {
  background: #f1f6ff;
  border-top: 1px solid #dde6ff;
  padding: 8px;
  font-size: 13px;
  display: none;
}

/* ===== تحسين الهاتف ===== */
@media (max-width: 600px) {
  .visual { font-size: 26px; }
  header h1 { font-size: 16px; }
}
</style>
</head>

<body>

<div class="app">

  <!-- ===== الرأس ===== -->
  <header>
    <h1>🐰 منهاج التعلّم: الجمع حتى ١٨</h1>
    <button class="fs-btn" id="fullscreenBtn">🖥️ ملء الشاشة</button>
  </header>

  <!-- ===== منطقة التعلّم ===== -->
  <main class="main">
    <div class="board">

      <div class="rabbit">🐰</div>

      <div class="question" id="questionText">
        كم المجموع؟
      </div>

      <div class="visual">
        <span id="leftVisual"></span>
        <span id="operator">＋</span>
        <span id="rightVisual"></span>
      </div>

      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback"></div>
    </div>
  </main>

  <!-- ===== شريط المعلم ===== -->
  <div class="teacher-bar" id="teacherBar">
    📘 ملاحظة للمعلم: <span id="teacherNote">—</span>
  </div>

</div>

<script>
/* ===== أدوات مساعدة ===== */
const toArabic = n => n.toString().split('').map(d=>'٠١٢٣٤٥٦٧٨٩'[d]).join('');
const rand = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle = a => a.sort(()=>Math.random()-0.5);

/* ===== عناصر ===== */
const leftV=document.getElementById("leftVisual");
const rightV=document.getElementById("rightVisual");
const questionText=document.getElementById("questionText");
const choices=document.getElementById("choices");
const feedback=document.getElementById("feedback");
const teacherBar=document.getElementById("teacherBar");
const teacherNote=document.getElementById("teacherNote");

/* ===== حالة التعلم ===== */
let correct=0, wrong=0;

/* ===== منطق الجمع ===== */
function newQuestion(){
  choices.innerHTML="";
  feedback.textContent="";
  questionText.textContent="كم المجموع؟";

  let a,b,total;
  do{
    a=rand(1,9);
    b=rand(1,9);
    total=a+b;
  }while(total>18);

  leftV.textContent="🍓".repeat(a);
  rightV.textContent="🍎".repeat(b);

  let options=new Set([total]);
  while(options.size<3){
    let f=total+rand(-2,2);
    if(f>=0 && f<=18) options.add(f);
  }

  shuffle([...options]).forEach(n=>{
    let btn=document.createElement("button");
    btn.textContent=toArabic(n);
    btn.onclick=()=>check(n,total,a,b);
    choices.appendChild(btn);
  });
}

function check(ans,total,a,b){
  if(ans===total){
    feedback.textContent=`✅ أحسنت! ${toArabic(a)} + ${toArabic(b)} = ${toArabic(total)}`;
    correct++; wrong=0;
    teacherNote.textContent="الفهم مستقر، يمكن المتابعة.";
    teacherBar.style.display="block";
    setTimeout(newQuestion,1300);
  }else{
    feedback.textContent="❌ جرّب مرة أخرى";
    wrong++; correct=0;
    teacherNote.textContent="خطأ طبيعي، دعم بصري مناسب.";
    teacherBar.style.display="block";
  }
}

/* ===== ملء الشاشة ===== */
const fsBtn=document.getElementById("fullscreenBtn");
fsBtn.onclick=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
    fsBtn.textContent="⛔ خروج من ملء الشاشة";
  }else{
    document.exitFullscreen();
    fsBtn.textContent="🖥️ ملء الشاشة";
  }
};

/* ===== تشغيل أولي ===== */
newQuestion();
</script>

</body>
</html>
