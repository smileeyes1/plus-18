<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منهاج الجمع – صف أول</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  margin: 0;
  padding: 20px;
  text-align: center;
}

h2 { margin-bottom: 12px; }

.stage { display: none; }

.board {
  background: #ffffff;
  border-radius: 14px;
  padding: 16px;
  max-width: 700px;
  margin: auto;
}

.buttons button {
  font-size: 18px;
  padding: 10px;
  margin: 6px;
}

.path {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}

.card {
  width: 200px;
  padding: 12px;
  border-radius: 12px;
  background: #ddd;
  opacity: 0.5;
}

.card.active {
  background: #ffffff;
  border: 3px solid #4CAF50;
  opacity: 1;
}
</style>
</head>

<body>

<h2>🧭 مسار التعلّم في الجمع</h2>

<div class="path">
  <div class="card active" id="p1">الجمع ضمن ١٠</div>
  <div class="card" id="p2">الجمع ضمن ١٨</div>
  <div class="card" id="p3">الإكمال إلى ١٠</div>
</div>

<div class="board">

<!-- ===== المرحلة 1 ===== -->
<div class="stage" id="stage1">
  <h3>➕ الجمع ضمن ١٠</h3>
  <div id="q1"></div>
  <div class="buttons" id="c1"></div>
  <p id="f1"></p>
</div>

<!-- ===== المرحلة 2 ===== -->
<div class="stage" id="stage2">
  <h3>➕ الجمع ضمن ١٨</h3>
  <div id="q2"></div>
  <div class="buttons" id="c2"></div>
  <p id="f2"></p>
</div>

<!-- ===== المرحلة 3 ===== -->
<div class="stage" id="stage3">
  <h3>🧠 نُكمّل إلى ١٠</h3>
  <div id="q3"></div>
  <div class="buttons" id="c3"></div>
  <p id="f3"></p>
</div>

</div>

<script>
/* ===== أدوات ===== */
function A(n){return n.toString().replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);}
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function show(id){document.querySelectorAll(".stage").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";}

let stage = parseInt(localStorage.getItem("stage")) || 1;
let score = 0;

activatePath();
startStage();

function activatePath(){
  if(stage >= 2) document.getElementById("p2").classList.add("active");
  if(stage >= 3) document.getElementById("p3").classList.add("active");
}

function startStage(){
  if(stage === 1){ show("stage1"); game10();}
  if(stage === 2){ show("stage2"); game18();}
  if(stage === 3){ show("stage3"); gameMake10();}
}

/* ===== المرحلة 1 ===== */
function game10(){
  let a,b,s;
  do{ a=R(1,5); b=R(1,5); s=a+b; }while(s>10);
  document.getElementById("q1").textContent = "🍎".repeat(a)+" + "+"🍓".repeat(b);
  answers("c1", s, (ok)=>{
    document.getElementById("f1").textContent = ok?"✅":"❌";
    progress(ok);
  });
}

/* ===== المرحلة 2 ===== */
function game18(){
  let a=R(1,9), b=R(1,9), s=a+b;
  if(s>18) return game18();
  document.getElementById("q2").textContent = "🍎".repeat(a)+" + "+"🍓".repeat(b);
  answers("c2", s, (ok)=>{
    document.getElementById("f2").textContent = ok?"✅":"❌";
    progress(ok);
  });
}

/* ===== المرحلة 3 ===== */
function gameMake10(){
  let a=R(6,9), b=R(1,5), s=a+b;
  let need=10-a;
  document.getElementById("q3").textContent =
    "🍓".repeat(a)+" + "+"🍎".repeat(need)+" + "+"🍏".repeat(b-need);
  answers("c3", s, (ok)=>{
    document.getElementById("f3").textContent = ok?"✅ أكملت ١٠":"❌";
  });
}

/* ===== مشترك ===== */
function answers(box, correct, cb){
  let set=new Set([correct]);
  while(set.size<3){let f=correct+R(-2,2); if(f>=0&&f<=18)set.add(f);}
  const c=document.getElementById(box); c.innerHTML="";
  [...set].forEach(n=>{
    let btn=document.createElement("button");
    btn.textContent=A(n);
    btn.onclick=()=>cb(n===correct);
    c.appendChild(btn);
  });
}

function progress(ok){
  if(!ok) return;
  score++;
  if(score>=4 && stage<3){
    stage++;
    score=0;
    localStorage.setItem("stage",stage);
    activatePath();
    startStage();
  } else setTimeout(startStage, 800);
}
</script>

</body>
</html>
